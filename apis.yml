apis:
- name: EMA Proprietary API
  description: >-
    ModMed's proprietary FHIR R4-style API over the EMA EHR and ModMed Practice Management. 58
    operations under /fhir/v2 across Patient, Practitioner, Organization, Location, Encounter,
    Appointment, Slot, Coverage, InsurancePlan, Account, ChargeItem, DocumentReference,
    MedicationStatement, AllergyIntolerance, Condition, FamilyMemberHistory, ServiceRequest,
    DiagnosticReport, Task, RelatedPerson and Composition — with READ, SEARCH, CREATE and UPDATE.
    Multi-tenant by firm_url_prefix; OAuth2 client_credentials plus a mandatory x-api-key header.
    Access requires a synapSYS Marketplace vendor application and technical review.
  humanURL: https://portal.api.modmed.com/docs/ema-proprietary-api
  baseURL: https://stage.ema-api.com/ema-dev/firm/apiportal/ema
