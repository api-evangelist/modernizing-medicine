aid: modernizing-medicine
name: ModMed
description: >-
  ModMed (Modernizing Medicine, Inc., Boca Raton FL) builds specialty-specific cloud healthcare
  software — the EMA electronic health record, ModMed Practice Management, gGastro for
  gastroenterology, analytics, revenue cycle management and telehealth — for allergy, dermatology,
  ENT, gastroenterology, OBGYN, ophthalmology, orthopedics, pain management, plastic surgery,
  podiatry and urology practices. It publishes two public APIs from one developer portal at
  portal.api.modmed.com: the EMA Proprietary API, a FHIR R4-style read/write interface under
  /fhir/v2 covering patients, appointments, slots, coverage, charges, documents and clinical data
  for synapSYS Marketplace vendors; and the ModMed Certified FHIR API, an ONC-certified HL7 FHIR
  R4 / US Core read-and-search interface with SMART on FHIR app launch and Bulk FHIR NDJSON export
  across EMA, ModMed PM, ModMed GI and gGastro. Customer FHIR service base URLs are published
  publicly as required by the 21st Century Cures Act.
