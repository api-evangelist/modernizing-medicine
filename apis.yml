- name: ModMed Certified FHIR API
  description: >-
    ModMed's ONC-certified HL7 FHIR R4 API for EMA, ModMed PM, ModMed GI and gGastro. 64 read and
    search operations across 31 US Core resource types plus Bulk FHIR $export at Patient and Group
    level, authorized with SMART App Launch (authorization_code + PKCE for patient and provider
    apps, client_credentials for background/bulk apps). Read and search only — no writes.
    Production only; no public sandbox. Practice service base URLs are published publicly.
  humanURL: https://portal.api.modmed.com/docs/register-to-become-a-modmed-certified-fhir-api-vendor
