generated: '2026-08-04'
method: derived
source: mcp/modernizing-medicine-mcp.yml + openapi/*.json
summary: 'ModMed publishes no business-capability MCP server. The only MCP endpoint on a ModMed host is
  the ReadMe documentation server at https://portal.api.modmed.com/mcp, whose tools operate on the DOCS,
  not on EMA/FHIR resources. Every one of the 125 published REST operations is therefore rest_only: no
  named MCP tool maps to a ModMed capability.'
surfaces:
  openapi:
  - openapi/modernizing-medicine-ema-proprietary-api-openapi.json
  - openapi/modernizing-medicine-certified-fhir-api-openapi.json
  - openapi/modernizing-medicine-ema-proprietary-auth-openapi.json
  - openapi/modernizing-medicine-certified-fhir-auth-openapi.json
  graphql: null
  mcp:
    url: https://portal.api.modmed.com/mcp
    gated: true
    note: tools/list returns HTTP 401 Authorization required; tool names taken from the portal client
      config, schemas not introspected
crosswalk: []
mcp_only:
- tool: search
  reason: Documentation search over the ModMed API portal — no backing REST operation
- tool: fetch
  reason: Fetches a documentation page — no backing REST operation
- tool: list-specs
  reason: Lists the portal OpenAPI documents — docs-plane metadata, not a ModMed API capability
- tool: list-endpoints
  reason: Lists documented endpoints — docs-plane metadata
- tool: search-endpoints
  reason: Searches documented endpoints — docs-plane metadata
- tool: get-endpoint
  reason: Returns one documented endpoint definition — docs-plane metadata
- tool: get-server-variables
  reason: Returns OpenAPI server variables (e.g. the firm prefix) — docs-plane metadata
- tool: execute-request
  reason: Generic OpenAPI request proxy — it can reach any documented operation but is not a named, schema-bound
    tool per capability
