          type: string
          format: date
      - name: encounter
        in: query
        description: An encounter in which this request is made
        required: false
        schema:
          type: string
      - name: page
        in: query
        description: Page to be used for paginated search
        required: false
        schema:
          type: string
      - name: patient
        in: query
        description: Search by subject - a patient
        required: false
        schema:
          type: string
      - name: requisition
        in: query
        description: Composite Request ID
        required: false
        schema:
          type: string
      - name: type
        in: query
        description: Diagnostic Report Type Search Parameter.
        required: false
        schema:
          type: string
