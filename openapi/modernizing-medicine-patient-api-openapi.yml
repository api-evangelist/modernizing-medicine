      default: fhirmp
      description: Your firm subdomain (e.g. fhirmp, auraderm). Find yours at https://mm-fhir-endpoint-display.prod.fhir.ema-api.com/
- url: https://stage.ema-api.com/ema-dev/firm/apiportal/ema
