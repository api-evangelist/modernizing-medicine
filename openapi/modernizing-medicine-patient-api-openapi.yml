  /fhir/v2/Patient/{id}:
    servers:
    - url: https://stage.ema-api.com/ema-dev/firm/apiportal/ema
    get:
      tags:
      - Patient
      summary: 'read-instance: Read Patient instance'
      parameters:
      - name: id
        in: path
        description: The resource ID
        required: true
        style: simple
        schema:
          minimum: 1
          type: string
        example: '123'
      - name: Content-flag
        in: header
        required: false
        description: Optional header. `Referral` adds Referral Contact and Referral Source information to the Patient payload.
        schema:
          type: string
          enum:
          - Referral
      responses:
        '200':
          description: Success
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/FHIR-JSON-RESOURCE'
              example:
                resourceType: Patient
                id: '450858'
                meta:
                  lastUpdated: '2026-06-25T15:55:00.000+00:00'
                extension:
                - url: http://hl7.org/fhir/us/core/StructureDefinition/us-core-ethnicity
                  extension:
                  - url: text
                    valueString: Unspecified
                identifier:
                - system: http://www.hl7.org/fhir/v2/0203/index.html#v2-0203-MR
                  value: MM0000000059
                - system: PMS
                  value: 112416PAT000000057
                active: true
                name:
                - family: Syrup
                  given:
                  - Mabel
                telecom:
                - system: email
                  value: mabel.syrup@modmed.com
                - system: phone
                  value: '9998887777'
                  use: mobile
                  rank: 1
                gender: female
                birthDate: '1980-01-01'
                deceasedBoolean: false
                address:
                - use: home
                  type: both
                  line:
                  - 123 MAIN ST
                  city: BOCA RATON
                  state: FL
                  postalCode: '33431'
                  country: United States of America
                maritalStatus:
                  coding:
                  - system: http://www.hl7.org/fhir/v2/0002
                    code: T
                    display: Unreported
                  text: Unreported
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
