docs: https://portal.api.modmed.com/reference/authentication-2
model: SMART on FHIR (SMART App Launch) scopes on the ONC Certified FHIR API. The EMA Proprietary API
  does NOT use OAuth scopes for authorization — its client_credentials token carries a space-separated
  list of ModMed-provisioned ACLs (e.g. "acl/enc_s acl/pat_s_name_dob_gen") granted per vendor application
  by the synapSYS team; the ACL vocabulary is not published publicly.
scope_groups:
- group: context
  scopes:
  - launch
  - launch/patient
  - launch/encounter
  description: Control what context claims the authorization server puts in the token.
- group: identity
  scopes:
  - openid
  - profile
  - fhirUser
  description: Control what the app learns about the authenticated user.
- group: session
  scopes:
  - online_access
  - offline_access
  description: Control refresh-token lifetime.
- group: resource
  prefixes:
  - patient/
  - user/
  - system/
  description: Read/search access to a FHIR resource type. patient/ is scoped to the token patient; user/
    to what the logged-in user can see; system/ is used by Bulk FHIR client_credentials apps.
smart_capabilities:
- context-style
- client-public
- sso-openid-connect
- authorize-post
- context-ehr-patient
- launch-standalone
- permission-patient
- permission-offline
- permission-user
- client-confidential-symmetric
- context-ehr-encounter
- client-confidential-asymmetric
- context-banner
- launch-ehr
- permission-v2
- context-standalone-patient
- permission-v1
